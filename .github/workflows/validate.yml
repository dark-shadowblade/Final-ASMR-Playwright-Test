name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install desktop dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: npm run check

      - name: Install Playwright Chromium into a portable folder
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $PWD ".pw-browsers"
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "Playwright Chromium installation failed." }
          if (-not (Get-ChildItem ".pw-browsers" -Directory -ErrorAction SilentlyContinue)) {
            throw "No Playwright browser directory was created."
          }

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify installer exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Windows installer EXE was not produced." }
          if ($exe.Length -lt 1MB) { throw "Installer is unexpectedly small: $($exe.Length) bytes" }
          Write-Host "Built: $($exe.FullName)"
          Write-Host "Size: $($exe.Length) bytes"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Final-ASMR-Playwright-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
